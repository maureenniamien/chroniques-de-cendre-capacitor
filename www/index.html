<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chroniques de Cendre</title>

     a retirer une fois le probleme d'affichage blanc resolu -->

<style>
  :root{
    --gold:#c9a24b;
    --ember:#e8672c;
    --blood:#8a2438;
    --arcane:#4b7bc9;
    --toxic:#6a9c3f;
    --void:#7c4fc9;
    --parchment:#d8c9a3;
    --ink:#0a0806;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
    font-family:'Cinzel','Georgia',serif; color:var(--parchment);}
  #canvas-wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:20;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:env(safe-area-inset-top,10px) 12px env(safe-area-inset-bottom,10px) 12px;}
  .hud-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .hero-panel{pointer-events:auto;background:linear-gradient(180deg,rgba(20,14,10,.88),rgba(10,7,5,.82));
    border:1px solid rgba(201,162,75,.35);border-radius:10px;padding:8px 12px;min-width:210px;
    backdrop-filter:blur(2px);}
  .hero-name{font-size:13px;letter-spacing:.06em;color:var(--gold);display:flex;justify-content:space-between;}
  .bar-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
  .bar-label{font-size:10px;width:16px;color:#a99;}
  .bar-track{flex:1;height:9px;border-radius:5px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.08);overflow:hidden;}
  .bar-fill{height:100%;transition:width .4s ease;}
  .bar-hp{background:linear-gradient(90deg,#6e1420,var(--blood));}
  .bar-mp{background:linear-gradient(90deg,#1f4a8a,var(--arcane));}
  .bar-text{font-size:9px;color:#cbb;min-width:52px;text-align:right;}
  .level-badge{pointer-events:auto;background:radial-gradient(circle at 30% 30%,#2a1f14,#0d0906);
    border:1px solid rgba(201,162,75,.45);border-radius:10px;padding:8px 14px;text-align:center;}
  .level-badge .n{font-size:20px;color:var(--gold);font-weight:700;line-height:1;}
  .level-badge .l{font-size:8px;letter-spacing:.15em;color:#998;}

  .hud-bottom{display:flex;justify-content:center;align-items:flex-end;pointer-events:none;}
  #joystick-zone{position:fixed;left:0;bottom:0;width:45%;height:45%;pointer-events:auto;}
  #joystick-base{position:fixed;width:96px;height:96px;border-radius:50%;
    border:2px solid rgba(216,201,163,.35);background:rgba(20,14,10,.35);display:none;}
  #joystick-nub{position:fixed;width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#e8d9b0,#8a7648);
    box-shadow:0 0 10px rgba(0,0,0,.6);display:none;}

  #interact-btn{position:fixed;right:22px;bottom:calc(90px + env(safe-area-inset-bottom,0px));
    pointer-events:auto;width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#e8b95a,#8a5a1c);
    border:2px solid rgba(255,235,190,.6);color:#2a1a06;font-size:11px;font-weight:700;
    letter-spacing:.05em;display:none;align-items:center;justify-content:center;text-align:center;
    box-shadow:0 0 18px rgba(232,150,60,.5),0 4px 10px rgba(0,0,0,.5);
    animation:pulse-btn 1.4s ease-in-out infinite;}
  @keyframes pulse-btn{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  /* ---------- Door prompt ---------- */
  #door-prompt{position:fixed;left:50%;top:20%;transform:translateX(-50%);pointer-events:none;
    text-align:center;opacity:0;transition:opacity .3s;z-index:15;}
  #door-prompt.show{opacity:1;}
  #door-prompt .type{font-size:22px;letter-spacing:.12em;text-transform:uppercase;}
  #door-prompt .sub{font-size:11px;color:#bba;margin-top:2px;}

  /* ---------- Iris transition ---------- */
  #iris{position:fixed;inset:0;z-index:50;pointer-events:none;background:#000;
    clip-path:circle(150% at 50% 50%);transition:clip-path .9s cubic-bezier(.7,0,.3,1);}
  #iris.closed{clip-path:circle(0% at 50% 50%);}

  /* ---------- Combat overlay ---------- */
  #combat{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;justify-content:flex-end;
    background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.92) 100%);}
  #combat.active{display:flex;}
  .monster-tag{align-self:center;margin-bottom:8px;text-align:center;pointer-events:none;}
  .monster-tag .mname{font-size:16px;color:#f2c9c9;letter-spacing:.05em;}
  .monster-tag .mbar{width:160px;height:8px;margin:4px auto 0;border-radius:4px;background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.15);overflow:hidden;}
  .monster-tag .mbar i{display:block;height:100%;background:linear-gradient(90deg,#7a1420,#c93a3a);transition:width .35s;}
  #combat-log{margin:0 14px 6px;min-height:18px;text-align:center;font-size:12px;color:var(--ember);
    text-shadow:0 1px 3px #000;}
  #combat-actions{display:flex;gap:8px;padding:10px 14px calc(16px + env(safe-area-inset-bottom,0px));}
  .cbtn{flex:1;padding:12px 4px;border-radius:10px;border:1px solid rgba(201,162,75,.4);
    background:linear-gradient(180deg,rgba(30,22,14,.92),rgba(12,9,6,.92));color:var(--parchment);
    font-family:inherit;font-size:12px;letter-spacing:.03em;text-align:center;}
  .cbtn:active{background:linear-gradient(180deg,rgba(60,44,20,.95),rgba(20,14,8,.95));}
  .cbtn small{display:block;color:#9a8a6a;font-size:9px;margin-top:2px;}

  /* ---------- Generic modal (tresor/marchand/repos/piege) ---------- */
  #modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.6);}
  #modal.active{display:flex;}
  .modal-card{width:min(340px,86vw);background:linear-gradient(180deg,#1c140c,#0c0805);
    border:1px solid rgba(201,162,75,.4);border-radius:14px;padding:20px;text-align:center;}
  .modal-card h2{margin:0 0 6px;font-size:18px;color:var(--gold);letter-spacing:.06em;}
  .modal-card p{margin:0 0 16px;font-size:13px;color:#c9baa0;line-height:1.5;}
  .modal-card button{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(201,162,75,.5);
    background:linear-gradient(180deg,#3a2a14,#1c1408);color:var(--parchment);font-family:inherit;font-size:13px;}

  #loading{position:fixed;inset:0;z-index:100;background:#050403;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:var(--gold);letter-spacing:.1em;font-size:13px;}
  #loading .ring{width:46px;height:46px;border-radius:50%;border:2px solid rgba(201,162,75,.2);
    border-top-color:var(--gold);animation:spin 1s linear infinite;margin-bottom:14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="loading"><div class="ring"></div>DESCENTE DANS LES CENDRES...</div>

<div id="canvas-wrap"></div>

<div id="hud">
  <div class="hud-top">
    <div class="hero-panel">
      <div class="hero-name"><span id="hero-name">Guerrier</span><span id="hero-lvl-tag">Nv.1</span></div>
      <div class="bar-row"><span class="bar-label">HP</span>
        <div class="bar-track"><div class="bar-fill bar-hp" id="bar-hp" style="width:100%"></div></div>
        <span class="bar-text" id="txt-hp">120/120</span></div>
      <div class="bar-row"><span class="bar-label">MP</span>
        <div class="bar-track"><div class="bar-fill bar-mp" id="bar-mp" style="width:100%"></div></div>
        <span class="bar-text" id="txt-mp">40/40</span></div>
    </div>
    <div class="level-badge"><div class="n" id="niveau-n">1</div><div class="l">NIVEAU</div></div>
  </div>
  <div class="hud-bottom"></div>
</div>

<div id="door-prompt"><div class="type" id="door-type-txt">COMBAT</div><div class="sub">Approcher puis toucher pour entrer</div></div>

<div id="joystick-zone">
  <div id="joystick-base"></div>
  <div id="joystick-nub"></div>
</div>
<div id="interact-btn">ENTRER</div>

<div id="iris"></div>

<div id="combat">
  <div class="monster-tag">
    <div class="mname" id="m-name">Chauve-souris Magenta</div>
    <div class="mbar"><i id="m-hp" style="width:100%"></i></div>
  </div>
  <div id="combat-log">Le combat commence !</div>
  <div id="combat-actions">
    <button class="cbtn" id="btn-atk">Attaque<small>0 MP</small></button>
    <button class="cbtn" id="btn-skill">Competence<small id="skill-cost">-- MP</small></button>
    <button class="cbtn" id="btn-flee">Fuir<small>&nbsp;</small></button>
  </div>
</div>

<div id="modal"><div class="modal-card">
  <h2 id="modal-title">Salle</h2>
  <p id="modal-text">...</p>
  <button id="modal-btn">Continuer</button>
</div></div>

<script>
  // rapport d'erreur visible a l'ecran (indispensable pour deboguer une app installee,
  // sans acces a la console) : toute erreur JS non interceptee s'affiche ici au lieu
  // de laisser un ecran noir muet.
  window.addEventListener('error', function(e){
    var el = document.getElementById('loading');
    if(el){
      el.style.display = 'flex';
      el.innerHTML = '<div style="color:#e86a6a;font-size:12px;max-width:85vw;text-align:center;line-height:1.6;padding:0 16px;">ERREUR<br>' +
        (e.message||'inconnue') + '<br><span style="opacity:.6;font-size:10px">' + (e.filename||'') + ':' + (e.lineno||'') + '</span></div>';
    }
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // filet de securite si cdnjs est indisponible : on charge un CDN de secours en
  // creant un vrai element <script> (jamais document.write, qui peut effacer toute
  // la page dans certains WebView).
  if (typeof THREE === 'undefined') {
    var fallback = document.createElement('script');
    fallback.src = 'https://unpkg.com/three@0.128.0/build/three.min.js';
    document.head.appendChild(fallback);
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
"use strict";
try{
console.log('[boot] IIFE principale demarree');
const DEBUG_NO_WEBGL = true; // TEST: si true, saute le rendu 3D et colore le fond pour isoler le probleme


/* =========================================================================
   CHRONIQUES DE CENDRE - reconstruction depuis le jeu Kotlin natif d'origine
   Priorite de cette version : vrai systeme de salles + portes (Combat /
   Piege / Tresor / Marchand / Repos / Boss), decor 3D reel, personnage
   visible et anime. Un seul fichier HTML, comme Studiora - deployable via
   GitHub Pages + Capacitor.
   ========================================================================= */

/* ---------------- Etat du heros (repris de la structure Hero du jeu Kotlin:
   nom, hp, hpMax, mana, manaMax, atk, def, xp, niveau, arme, statut...) ---- */
const Hero = {
  nom:"Guerrier", classe:"Guerrier",
  niveau:1, xp:0, xpRequis:50,
  hp:120, hpMax:120, mana:40, manaMax:40,
  atk:16, def:9, critBase:0.20,
  regenMana:1
};

/* Types de salle retrouves dans l'APK d'origine (enum TypeSalle) */
const TypeSalle = {
  COMBAT:  {key:"COMBAT",  label:"Combat",   color:0xc93a3a, hud:"#c93a3a", desc:"Un ennemi bloque le passage."},
  PIEGE:   {key:"PIEGE",   label:"Piege",    color:0xd6b23a, hud:"#d6b23a", desc:"Quelque chose ne va pas ici..."},
  TRESOR:  {key:"TRESOR",  label:"Tresor",   color:0xc9a24b, hud:"#c9a24b", desc:"Un coffre scintille dans l'ombre."},
  MARCHAND:{key:"MARCHAND",label:"Marchand", color:0x4b7bc9, hud:"#4b7bc9", desc:"Une silhouette encapuchonnee propose ses biens."},
  REPOS:   {key:"REPOS",   label:"Repos",    color:0x6a9c3f, hud:"#6a9c3f", desc:"Un feu de camp brule doucement."},
  BOSS:    {key:"BOSS",    label:"Boss",     color:0x7c4fc9, hud:"#7c4fc9", desc:"Une presence massive attend au-dela."}
};

const MONSTRES = [
  {nom:"Chauve-souris Magenta", hp:38, atk:9},
  {nom:"Rodeur des Cendres",    hp:52, atk:12},
  {nom:"Golem Fissure",         hp:70, atk:14},
];
const BOSS_LIST = [
  {nom:"Gardien du Cercle Rituel", hp:220, atk:22, boss:true}
];

/* ================= THREE.JS SETUP ================= */
const wrap = document.getElementById('canvas-wrap');
console.log('[boot] script demarre, THREE dispo:', typeof THREE, 'GLTFLoader dispo:', !!(window.THREE && THREE.GLTFLoader));
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
console.log('[boot] renderer cree, contexte webgl:', !!renderer.getContext());
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
wrap.appendChild(renderer.domElement);
if(DEBUG_NO_WEBGL){
  renderer.domElement.style.display = 'none';
  document.body.style.background = '#c0392b';
  console.log('[boot] MODE TEST: canvas WebGL cache, fond rouge force pour verifier le HUD seul');
}

const scene = new THREE.Scene();
console.log('[boot] scene creee, taille fenetre:', window.innerWidth, 'x', window.innerHeight);
scene.fog = new THREE.FogExp2(0x040302, 0.045);
scene.background = new THREE.Color(0x040302);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.1, 200);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---- lumieres ---- */
const ambient = new THREE.AmbientLight(0x2a2420, 0.55);
scene.add(ambient);

const shaft = new THREE.SpotLight(0xdcd0b0, 1.6, 26, Math.PI/9, 0.6, 1.2);
shaft.position.set(0, 12, 0);
shaft.target.position.set(0,0,0);
shaft.castShadow = true;
shaft.shadow.mapSize.set(1024,1024);
scene.add(shaft, shaft.target);

const torchLights = [];
function makeTorch(x,z){
  const group = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08,0.1,1.6,8),
    new THREE.MeshStandardMaterial({color:0x2b2620, roughness:0.9})
  );
  pole.position.y = 0.8;
  pole.castShadow = true;
  const bowl = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22,0.14,0.22,8),
    new THREE.MeshStandardMaterial({color:0x1c1a17, roughness:0.8, metalness:0.3})
  );
  bowl.position.y = 1.65;
  const flameLight = new THREE.PointLight(0xff7a2a, 2.1, 7, 2);
  flameLight.position.y = 1.95;
  flameLight.castShadow = false;
  const flameGeo = new THREE.ConeGeometry(0.14,0.42,8);
  const flameMat = new THREE.MeshBasicMaterial({color:0xffb050, transparent:true, opacity:0.9});
  const flame = new THREE.Mesh(flameGeo, flameMat);
  flame.position.y = 1.95;
  group.add(pole, bowl, flameLight, flame);
  group.position.set(x,0,z);
  group.userData.flame = flame;
  group.userData.light = flameLight;
  group.userData.seed = Math.random()*10;
  scene.add(group);
  torchLights.push(group);
}

/* ---- sol : plateforme circulaire avec cercle rituel grave ---- */
const floorGroup = new THREE.Group();
const stoneMat = new THREE.MeshStandardMaterial({color:0x3a352e, roughness:0.95, metalness:0.05});
const floor = new THREE.Mesh(new THREE.CylinderGeometry(9,9.3,0.6,48), stoneMat);
floor.receiveShadow = true;
floor.position.y = -0.3;
floorGroup.add(floor);

function ritualRing(radius, thickness, color, y){
  const geo = new THREE.RingGeometry(radius-thickness, radius, 64);
  const mat = new THREE.MeshStandardMaterial({color:color, emissive:color, emissiveIntensity:0.25,
    roughness:0.6, side:THREE.DoubleSide, transparent:true, opacity:0.85});
  const ring = new THREE.Mesh(geo, mat);
  ring.rotation.x = -Math.PI/2;
  ring.position.y = y;
  floorGroup.add(ring);
  return ring;
}
ritualRing(7.6,0.06,0x8a6a2c,0.005);
ritualRing(5.4,0.05,0x8a6a2c,0.006);
ritualRing(3.0,0.09,0xb98a3a,0.007);
const glyphRing = ritualRing(4.2,0.03,0xd6a94b,0.008);

const outerFloor = new THREE.Mesh(
  new THREE.CylinderGeometry(14,14,0.4,48),
  new THREE.MeshStandardMaterial({color:0x211e1a, roughness:1})
);
outerFloor.position.y = -0.5;
outerFloor.receiveShadow = true;
scene.add(outerFloor);
scene.add(floorGroup);

/* ---- murs + piliers circulaires (rotonde) ---- */
const wallMat = new THREE.MeshStandardMaterial({color:0x1c1a17, roughness:1});
const wallRadius = 13.5;
const wall = new THREE.Mesh(
  new THREE.CylinderGeometry(wallRadius, wallRadius, 9, 32, 1, true),
  wallMat
);
wall.material.side = THREE.BackSide;
wall.position.y = 4;
scene.add(wall);

const domeMat = new THREE.MeshStandardMaterial({color:0x171512, roughness:1, side:THREE.BackSide});
const dome = new THREE.Mesh(new THREE.SphereGeometry(wallRadius, 32, 16, 0, Math.PI*2, 0, Math.PI/2), domeMat);
dome.position.y = 8.5;
scene.add(dome);

const pillarMat = new THREE.MeshStandardMaterial({color:0x2e2a24, roughness:0.9});
const pillarCount = 8;
for(let i=0;i<pillarCount;i++){
  const a = (i/pillarCount)*Math.PI*2;
  const px = Math.cos(a)*10.4, pz = Math.sin(a)*10.4;
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.65,8,10), pillarMat);
  pillar.position.set(px,4,pz);
  pillar.castShadow = true; pillar.receiveShadow = true;
  scene.add(pillar);
  if(i%2===0) makeTorch(px*0.86, pz*0.86);
}

/* particules de poussiere dans le rayon de lumiere */
const dustGeo = new THREE.BufferGeometry();
const dustCount = 220;
const dustPos = new Float32Array(dustCount*3);
for(let i=0;i<dustCount;i++){
  dustPos[i*3] = (Math.random()-0.5)*3.4;
  dustPos[i*3+1] = Math.random()*10;
  dustPos[i*3+2] = (Math.random()-0.5)*3.4;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos,3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({color:0xd8c9a3,size:0.02,transparent:true,opacity:0.35}));
scene.add(dust);

/* ================= PERSONNAGE (procedural, pas des triangles) ================= */
function buildHumanoid(primaryColor, accentColor){
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({color:0xcfa87a, roughness:0.8});
  const cloth = new THREE.MeshStandardMaterial({color:primaryColor, roughness:0.75});
  const trim = new THREE.MeshStandardMaterial({color:accentColor, roughness:0.4, metalness:0.5});

  const hip = new THREE.Group(); hip.position.y = 0.95; g.add(hip);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.58,0.28), cloth);
  torso.position.y = 0.34; torso.castShadow = true;
  hip.add(torso);

  const belt = new THREE.Mesh(new THREE.BoxGeometry(0.48,0.08,0.30), trim);
  belt.position.y = 0.06; hip.add(belt);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17,14,12), skin);
  head.position.y = 0.78; head.castShadow = true;
  hip.add(head);
  const hood = new THREE.Mesh(new THREE.ConeGeometry(0.19,0.22,10), cloth);
  hood.position.y = 0.90; hood.rotation.x = Math.PI;
  hip.add(hood);

  function limb(len, rad, mat){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rad,rad*0.85,len,8), mat);
    m.castShadow = true;
    const pivot = new THREE.Group();
    m.position.y = -len/2;
    pivot.add(m);
    return pivot;
  }
  const armL = limb(0.42,0.07,cloth); armL.position.set(0.30,0.62,0);
  const armR = limb(0.42,0.07,cloth); armR.position.set(-0.30,0.62,0);
  const legL = limb(0.52,0.09,new THREE.MeshStandardMaterial({color:0x2a2620,roughness:0.9}));
  legL.position.set(0.14,0.0,0);
  const legR = legL.clone(); legR.position.set(-0.14,0.0,0);
  hip.add(armL,armR,legL,legR);

  const weapon = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.62,0.06), trim);
  weapon.position.set(0,-0.5,0.05);
  armR.add(weapon);

  g.userData = {hip, armL, armR, legL, legR, torso, walk:0};
  g.castShadow = true;
  return g;
}

/* ---- chargement du vrai modele rigge (.glb, squelette mixamorig) avec
   repli automatique sur le personnage procedural si le modele est absent
   ou ne charge pas ---- */
const HERO_MODEL_URL = 'assets/models/guerrier.glb'; // a placer dans le depot (voir commandes Termux)
const BONE_NAMES = {
  hips:'mixamorig:Hips', spine:'mixamorig:Spine',
  armL:'mixamorig:LeftArm', armR:'mixamorig:RightArm',
  foreArmL:'mixamorig:LeftForeArm', foreArmR:'mixamorig:RightForeArm',
  legL:'mixamorig:LeftUpLeg', legR:'mixamorig:RightUpLeg',
  shinL:'mixamorig:LeftLeg', shinR:'mixamorig:RightLeg'
};

const player = new THREE.Group();
player.position.set(0,0,7.6);
scene.add(player);
player.userData = {ready:false, mode:'procedural', walk:0};

function attachProceduralFallback(){
  const proc = buildHumanoid(0x5a4636, 0xc9a24b);
  player.add(proc);
  player.userData.proc = proc.userData;
  player.userData.mode = 'procedural';
  player.userData.ready = true;
}

function riggedWalk(ud, dt, moving){
  if(moving){
    ud.walk += dt*9;
    const s = Math.sin(ud.walk);
    if(ud.b.armL) ud.b.armL.rotation.x = s*0.7;
    if(ud.b.armR) ud.b.armR.rotation.x = -s*0.7;
    if(ud.b.legL) ud.b.legL.rotation.x = -s*0.6;
    if(ud.b.legR) ud.b.legR.rotation.x = s*0.6;
    if(ud.b.foreArmL) ud.b.foreArmL.rotation.x = Math.max(0,-s)*0.5;
    if(ud.b.foreArmR) ud.b.foreArmR.rotation.x = Math.max(0,s)*0.5;
  } else {
    ['armL','armR','legL','legR','foreArmL','foreArmR'].forEach(k=>{
      if(ud.b[k]) ud.b[k].rotation.x *= 0.85;
    });
  }
}

if(window.THREE && THREE.GLTFLoader){
  const loader = new THREE.GLTFLoader();
  loader.load(HERO_MODEL_URL, (gltf)=>{
    const model = gltf.scene;
    model.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    player.add(model);              // ajoute a la scene AVANT tout calcul de taille
    model.updateMatrixWorld(true);  // force Three.js a calculer les vraies positions/tailles

    // recentrer et mettre a l'echelle sur une hauteur d'environ 1.75m
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3(); box.getSize(size);
    const scale = size.y>0 ? 1.75/size.y : 1;
    model.scale.setScalar(scale);
    model.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(model);
    model.position.y -= box2.min.y;  // pose exactement les pieds au sol, plus d'enfoncement

    const bones = {};
    for(const k in BONE_NAMES){ bones[k] = model.getObjectByName(BONE_NAMES[k].replace(':','')) || model.getObjectByName(BONE_NAMES[k]); }
    player.userData.b = bones;
    player.userData.mode = 'rigged';
    player.userData.ready = true;
  }, undefined, (err)=>{
    console.warn('Modele heros introuvable, repli sur le personnage procedural.', err);
    attachProceduralFallback();
  });

/* ================= DEPLACEMENT (joystick tactile) ================= */
const move = {x:0,y:0,active:false};
const zone = document.getElementById('joystick-zone');
const base = document.getElementById('joystick-base');
const nub  = document.getElementById('joystick-nub');
let touchId = null, baseX=0, baseY=0;

function jStart(x,y){
  baseX=x; baseY=y;
  base.style.left=(x-48)+'px'; base.style.top=(y-48)+'px';
  nub.style.left=(x-21)+'px'; nub.style.top=(y-21)+'px';
  base.style.display='block'; nub.style.display='block';
  move.active = true;
}
function jMove(x,y){
  let dx=x-baseX, dy=y-baseY;
  const dist = Math.min(46, Math.hypot(dx,dy));
  const ang = Math.atan2(dy,dx);
  const nx = Math.cos(ang)*dist, ny = Math.sin(ang)*dist;
  nub.style.left=(baseX+nx-21)+'px'; nub.style.top=(baseY+ny-21)+'px';
  move.x = nx/46; move.y = ny/46;
}
function jEnd(){
  move.active=false; move.x=0; move.y=0;
  base.style.display='none'; nub.style.display='none';
  touchId = null;
}
zone.addEventListener('touchstart', e=>{
  if(touchId!==null) return;
  const t = e.changedTouches[0]; touchId = t.identifier;
  jStart(t.clientX,t.clientY); e.preventDefault();
},{passive:false});
zone.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){ if(t.identifier===touchId){ jMove(t.clientX,t.clientY); } }
  e.preventDefault();
},{passive:false});
zone.addEventListener('touchend', e=>{
  for(const t of e.changedTouches){ if(t.identifier===touchId) jEnd(); }
});
// souris (test desktop)
let mouseDown=false;
zone.addEventListener('mousedown', e=>{mouseDown=true; jStart(e.clientX,e.clientY);});
window.addEventListener('mousemove', e=>{if(mouseDown) jMove(e.clientX,e.clientY);});
window.addEventListener('mouseup', ()=>{if(mouseDown){mouseDown=false; jEnd();}});

/* ================= SALLES / PORTES ================= */
let doors = [];
let currentRoomCleared = true;
let nearDoor = null;

function pick(n, arr){
  const pool = arr.slice(); const out=[];
  while(out.length<n && pool.length){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
  return out;
}

function spawnDoors(){
  doors.forEach(d=> scene.remove(d.group));
  doors = [];
  const pool = [TypeSalle.COMBAT, TypeSalle.PIEGE, TypeSalle.TRESOR, TypeSalle.MARCHAND, TypeSalle.REPOS];
  let choices;
  if(Hero.niveau % 10 === 0){
    choices = [TypeSalle.BOSS];
  } else {
    choices = pick(3, pool);
  }
  const n = choices.length;
  const spread = n===1 ? 0 : Math.PI*0.6;
  choices.forEach((type,i)=>{
    const a = Math.PI + (n===1?0:(i/(n-1)-0.5)*spread); // face vers -z (fond de la salle)
    const radius = 9.6;
    const x = Math.cos(a)*radius, z = Math.sin(a)*radius;
    const group = buildDoor(type);
    group.position.set(x,0,z);
    group.lookAt(0,0,0);
    scene.add(group);
    doors.push({group,type,x,z,opened:false});
  });
}

function buildDoor(type){
  const g = new THREE.Group();
  const frameMat = new THREE.MeshStandardMaterial({color:0x2a251e, roughness:0.85});
  const glowMat = new THREE.MeshStandardMaterial({color:type.color, emissive:type.color, emissiveIntensity:0.55, roughness:0.4});
  const jL = new THREE.Mesh(new THREE.BoxGeometry(0.35,3.2,0.4), frameMat); jL.position.set(-0.85,1.6,0);
  const jR = jL.clone(); jR.position.x = 0.85;
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.1,0.4,0.4), frameMat); top.position.set(0,3.2,0);
  const arch = new THREE.Mesh(new THREE.TorusGeometry(0.85,0.12,8,16,Math.PI), frameMat);
  arch.position.set(0,3.2,0);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.9), glowMat);
  panel.position.set(0,1.5,-0.05);
  const sigil = new THREE.Mesh(new THREE.RingGeometry(0.28,0.36,24), new THREE.MeshBasicMaterial({color:type.color}));
  sigil.position.set(0,2.0,0.03);
  g.add(jL,jR,top,panel,sigil);
  [jL,jR,top].forEach(m=>{m.castShadow=true;});
  g.userData.panel = panel;
  return g;
}

spawnDoors();
console.log('[boot] portes generees:', doors.length);
const doorPrompt = document.getElementById('door-prompt');
const doorTypeTxt = document.getElementById('door-type-txt');
const interactBtn = document.getElementById('interact-btn');

function updateNearDoor(){
  let closest=null, closestDist=1.8;
  doors.forEach(d=>{
    const dist = Math.hypot(player.position.x-d.x, player.position.z-d.z);
    if(dist<closestDist){closest=d; closestDist=dist;}
  });
  if(closest!==nearDoor){
    nearDoor = closest;
    if(nearDoor){
      doorTypeTxt.textContent = nearDoor.type.label.toUpperCase();
      doorTypeTxt.style.color = nearDoor.type.hud;
      doorPrompt.classList.add('show');
      interactBtn.style.display='flex';
    } else {
      doorPrompt.classList.remove('show');
      interactBtn.style.display='none';
    }
  }
}

function enterDoor(door){
  if(!currentRoomCleared) return;
  const iris = document.getElementById('iris');
  iris.classList.add('closed');
  setTimeout(()=>{
    resolveRoom(door.type);
    iris.classList.remove('closed');
  }, 900);
  doorPrompt.classList.remove('show');
  interactBtn.style.display='none';
  nearDoor = null;
}
interactBtn.addEventListener('click', ()=>{ if(nearDoor) enterDoor(nearDoor); });
interactBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); if(nearDoor) enterDoor(nearDoor); },{passive:false});

/* ---- resolution d'une salle selon son type ---- */
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalText = document.getElementById('modal-text');
const modalBtn = document.getElementById('modal-btn');

function showModal(title, text, cb){
  modalTitle.textContent = title;
  modalText.textContent = text;
  modal.classList.add('active');
  modalBtn.onclick = ()=>{ modal.classList.remove('active'); cb && cb(); };
}

function nextLevel(){
  Hero.niveau++;
  document.getElementById('niveau-n').textContent = Hero.niveau;
  currentRoomCleared = true;
  player.position.set(0,0,7.6);
  spawnDoors();
}

function resolveRoom(type){
  switch(type.key){
    case 'COMBAT': startCombat(pickRandom(MONSTRES)); break;
    case 'BOSS': startCombat(pickRandom(BOSS_LIST)); break;
    case 'PIEGE': {
      const dmg = 8 + Math.floor(Math.random()*10);
      Hero.hp = Math.max(1, Hero.hp - dmg);
      refreshHUD();
      showModal('Piege !', `Une lame surgit du mur. -${dmg} HP.`, nextLevel);
      break;
    }
    case 'TRESOR': {
      const or = 20 + Math.floor(Math.random()*60);
      showModal('Tresor', `Le coffre s'ouvre : +${or} or.`, nextLevel);
      break;
    }
    case 'MARCHAND': {
      showModal('Le Marchand', 'Potions de Mana et objets disponibles a l\'achat.', nextLevel);
      break;
    }
    case 'REPOS': {
      Hero.hp = Hero.hpMax; Hero.mana = Hero.manaMax;
      refreshHUD();
      showModal('Salle de Repos', 'Vous reprenez des forces. HP et Mana au maximum.', nextLevel);
      break;
    }
  }
}
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ================= COMBAT ================= */
const combatEl = document.getElementById('combat');
const mName = document.getElementById('m-name');
const mHpBar = document.getElementById('m-hp');
const combatLog = document.getElementById('combat-log');
let monster = null;

function startCombat(base){
  monster = {nom:base.nom, hp:base.hp, hpMax:base.hp, atk:base.atk, boss:!!base.boss};
  mName.textContent = monster.nom;
  mHpBar.style.width='100%';
  combatLog.textContent = monster.boss ? 'Le Gardien se dresse devant vous !' : 'Un ennemi apparait !';
  currentRoomCleared = false;
  combatEl.classList.add('active');
}

function endCombatVictory(){
  combatEl.classList.remove('active');
  const xp = monster.boss ? 120 : 18 + Math.floor(Math.random()*10);
  Hero.xp += xp;
  if(Hero.xp>=Hero.xpRequis){ Hero.xp=0; Hero.xpRequis=Math.floor(Hero.xpRequis*1.18); Hero.hpMax+=12; Hero.manaMax+=4; Hero.atk+=2; Hero.hp=Hero.hpMax; Hero.mana=Hero.manaMax; }
  refreshHUD();
  showModal(monster.boss?'Boss vaincu !':'Victoire', `+${xp} XP`, nextLevel);
}
function endCombatDefeat(){
  combatEl.classList.remove('active');
  Hero.hp = Hero.hpMax; Hero.mana = Hero.manaMax; Hero.niveau = Math.max(1, Hero.niveau-1);
  refreshHUD();
  document.getElementById('niveau-n').textContent = Hero.niveau;
  currentRoomCleared = true;
  showModal('Defaite...', 'Vous reculez d\'un niveau pour reprendre des forces.', ()=>{ spawnDoors(); });
}

document.getElementById('btn-atk').addEventListener('click', ()=>playerAttack(false));
document.getElementById('btn-skill').addEventListener('click', ()=>playerAttack(true));
document.getElementById('btn-flee').addEventListener('click', ()=>{
  if(Math.random()<0.5){ combatLog.textContent='Vous fuyez le combat.'; combatEl.classList.remove('active'); currentRoomCleared=true; }
  else { combatLog.textContent='Fuite impossible !'; monsterAttack(); }
});

function playerAttack(skill){
  if(skill && Hero.mana<10){ combatLog.textContent='Mana insuffisant !'; return; }
  let dmg = Hero.atk + Math.floor(Math.random()*6);
  if(skill){ dmg = Math.floor(dmg*1.7); Hero.mana-=10; refreshHUD(); }
  const crit = Math.random()<Hero.critBase;
  if(crit) dmg = Math.floor(dmg*1.6);
  monster.hp = Math.max(0, monster.hp - dmg);
  mHpBar.style.width = Math.max(0,(monster.hp/monster.hpMax*100))+'%';
  combatLog.textContent = crit? `Coup critique ! -${dmg} HP` : `-${dmg} HP`;
  if(monster.hp<=0){ setTimeout(endCombatVictory, 400); return; }
  setTimeout(monsterAttack, 550);
}
function monsterAttack(){
  const dmg = Math.max(1, monster.atk - Math.floor(Hero.def*0.4) + Math.floor(Math.random()*5));
  Hero.hp = Math.max(0, Hero.hp - dmg);
  refreshHUD();
  combatLog.textContent += ` - riposte: -${dmg} HP`;
  if(Hero.hp<=0){ setTimeout(endCombatDefeat, 400); }
}

function refreshHUD(){
  document.getElementById('bar-hp').style.width = Math.max(0,Hero.hp/Hero.hpMax*100)+'%';
  document.getElementById('bar-mp').style.width = Math.max(0,Hero.mana/Hero.manaMax*100)+'%';
  document.getElementById('txt-hp').textContent = Hero.hp+'/'+Hero.hpMax;
  document.getElementById('txt-mp').textContent = Hero.mana+'/'+Hero.manaMax;
}
refreshHUD();

/* ================= BOUCLE PRINCIPALE ================= */
const clock = new THREE.Clock();
const roomLimit = 9.0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  torchLights.forEach(tg=>{
    const seed = tg.userData.seed;
    const flick = 1.7 + Math.sin(t*9+seed)*0.35 + Math.sin(t*23+seed)*0.15;
    tg.userData.light.intensity = flick;
    tg.userData.flame.scale.y = 1 + Math.sin(t*14+seed)*0.18;
  });
  dust.rotation.y += dt*0.03;

  if(currentRoomCleared){
    let ix=0, iz=0;
    if(move.active){ ix=move.x; iz=move.y; }
    if(keys['w']||keys['arrowup']) iz=-1;
    if(keys['s']||keys['arrowdown']) iz=1;
    if(keys['a']||keys['arrowleft']) ix=-1;
    if(keys['d']||keys['arrowright']) ix=1;

    const speed = 3.1;
    const moving = (ix*ix+iz*iz) > 0.02;
    if(moving){
      const targetYaw = Math.atan2(ix,iz);
      let diff = targetYaw - player.rotation.y;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      player.rotation.y += diff*Math.min(1,dt*10);
      const nx = player.position.x + ix*speed*dt;
      const nz = player.position.z + iz*speed*dt;
      if(Math.hypot(nx,nz) < roomLimit){ player.position.x = nx; player.position.z = nz; }
    }
    if(player.userData.ready){
      if(player.userData.mode==='rigged'){
        riggedWalk(player.userData, dt, moving);
      } else if(player.userData.proc){
        const ud = player.userData.proc;
        if(moving){
          ud.walk += dt*9;
          ud.armL.rotation.x = Math.sin(ud.walk)*0.9;
          ud.armR.rotation.x = -Math.sin(ud.walk)*0.9;
          ud.legL.rotation.x = -Math.sin(ud.walk)*0.9;
          ud.legR.rotation.x = Math.sin(ud.walk)*0.9;
          ud.hip.position.y = 0.95 + Math.abs(Math.sin(ud.walk*2))*0.03;
        } else {
          ud.armL.rotation.x *= 0.85; ud.armR.rotation.x *= 0.85;
          ud.legL.rotation.x *= 0.85; ud.legR.rotation.x *= 0.85;
        }
      }
    }
    updateNearDoor();
  }

  /* camera troisieme personne, suit doucement derriere le heros */
  const behind = new THREE.Vector3(
    player.position.x - Math.sin(player.rotation.y)*4.6,
    3.1,
    player.position.z - Math.cos(player.rotation.y)*4.6
  );
  camera.position.lerp(behind, 1-Math.pow(0.001,dt));
  const lookAt = new THREE.Vector3(player.position.x, 1.3, player.position.z);
  camPivot.position.lerp(lookAt, 1-Math.pow(0.001,dt));
  camera.lookAt(camPivot.position);

  if(!DEBUG_NO_WEBGL) renderer.render(scene, camera);
}
